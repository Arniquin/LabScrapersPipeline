<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pipeline Lab{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN - Prepared for your dynamic updates -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex" 
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 fixed h-full flex flex-col">
        <div class="p-6">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                <span class="text-blue-500">🚀</span> Pipeline Lab
            </h1>
        </div>

        <nav class="flex-1 px-4 space-y-2">
            <a href="{% url 'pipelines' %}" 
            class="flex w-full items-center px-4 py-2 rounded-lg font-medium gap-x-2 transition-all duration-200
            {% if request.resolver_match.url_name == 'pipelines' %}
                bg-blue-600 text-white
            {% else %}
                text-slate-400 hover:bg-slate-700/50 hover:text-white
            {% endif %}">
                <span class="material-symbols-outlined text-2xl 
                    {% if request.resolver_match.url_name == 'pipelines' %}text-white{% else %}text-blue-500{% endif %}">
                    water_pump
                </span>
                <span>Pipelines</span>
            </a>
            
            <a href="{% url 'clients_list' %}" 
            class="flex w-full items-center px-4 py-2 rounded-lg font-medium gap-x-2 transition-all duration-200
            {% if request.resolver_match.url_name == 'clients_list' or request.resolver_match.url_name == 'add_client' %}
                bg-blue-600 text-white
            {% else %}
                text-slate-400 hover:bg-slate-700/50 hover:text-white
            {% endif %}">
                <span class="material-symbols-outlined text-2xl 
                    {% if request.resolver_match.url_name == 'clients_list' %}text-white{% else %}text-blue-500{% endif %}">
                    contacts_product
                </span>
                <span>Clients</span>
            </a>

            <a href="{% url 'scheduler_view' %}" 
            class="flex w-full items-center px-4 py-2 rounded-lg font-medium gap-x-2 transition-all duration-200
            {% if request.resolver_match.url_name == 'scheduler_view' %}
                bg-blue-600 text-white
            {% else %}
                text-slate-400 hover:bg-slate-700/50 hover:text-white
            {% endif %}">
                <span class="material-symbols-outlined text-2xl 
                    {% if request.resolver_match.url_name == 'scheduler_view' %}text-white{% else %}text-blue-500{% endif %}">
                    schedule
                </span>
                <span>Scheduler</span>
            </a>

            <a href="{% url 'runs_view' %}" 
            class="flex w-full items-center px-4 py-2 rounded-lg font-medium gap-x-2 transition-all duration-200
            {% if request.resolver_match.url_name == 'runs_view' %}
                bg-blue-600 text-white
            {% else %}
                text-slate-400 hover:bg-slate-700/50 hover:text-white
            {% endif %}">
                <span class="material-symbols-outlined text-2xl 
                    {% if request.resolver_match.url_name == 'runs_view' %}text-white{% else %}text-blue-500{% endif %}">
                    history
                </span>
                <span>Runs History</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 px-2">
                <div class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center text-xs font-bold">
                    DEV
                </div>
                <div class="text-xs">
                    <p class="font-medium">Admin User</p>
                    <p class="text-slate-500">ProBook Node</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 ml-64 p-8">
        {% block content %}
        <!-- Child templates will inject their HTML here -->
        {% endblock %}
    </main>

</body>
</html>
