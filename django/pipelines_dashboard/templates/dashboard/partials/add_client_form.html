<!-- dashboard/partials/add_client_form.html -->
<tr id="new-client-form" class="bg-blue-900/10 border-b-2 border-blue-500">
    <td class="px-6 py-4">
        <span class="material-symbols-outlined text-blue-500">person_add</span>
    </td>
    <td class="px-6 py-4">
        <input type="text" name="name" form="create-client-form" placeholder="Client Name" 
               class="bg-slate-800 border border-slate-700 rounded px-3 py-1 text-sm w-full focus:border-blue-500 outline-none" required>
    </td>
    <td class="px-6 py-4">
        <input type="email" name="email" form="create-client-form" placeholder="email@example.com" 
               class="bg-slate-800 border border-slate-700 rounded px-3 py-1 text-sm w-full focus:border-blue-500 outline-none">
    </td>
    <td class="px-6 py-4 text-right">
        <form id="create-client-form" 
              hx-post="{% url 'add_client' %}" 
              hx-target="#new-client-form" 
              hx-swap="outerHTML" 
              class="flex justify-end gap-2">
            <button type="submit" class="text-green-400 hover:text-green-300 material-symbols-outlined">check_circle</button>
            <!-- Clicking cancel just removes this temporary row -->
            <button type="button" onclick="this.closest('tr').remove()" class="text-slate-500 hover:text-slate-300 material-symbols-outlined">cancel</button>
        </form>
    </td>
</tr>
