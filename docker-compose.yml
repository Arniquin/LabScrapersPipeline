services:
  # --- Django Application ---
  django:
    build:
      context: ./django/
    container_name: django_app
    restart: unless-stopped
    volumes:
      - ./django:/app
      - ./jupyter/jupyter_data:/app/jupyter_data
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${POSTGRES_DB:-djangodb}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # --- Celery Worker (Para ejecutar los scrapers en segundo plano) ---
  celery_worker:
    build:
      context: ./django/
    container_name: celery_worker
    restart: unless-stopped
    volumes:
      - ./django:/app
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${POSTGRES_DB:-djangodb}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SELENIUM_REMOTE_URL=http://chrome:4444/wd/hub
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - chrome
    command: celery -A config worker --loglevel=info

  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-djangodb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    env_file:
      - .env

  # --- Redis Broker (Mensajería para Celery) ---
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    restart: unless-stopped
    ports:
      - "6379:6379"

  # --- Contenedor de Jupyter ---
  jupyterlab:
    build:
      context: ./jupyter/
    container_name: jupyterlab
    restart: unless-stopped
    depends_on:
      - chrome
    volumes:
      - ./jupyter/jupyter_data:/home/jovyan/work
    env_file:
      - .env
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - SELENIUM_REMOTE_URL=http://chrome:4444/wd/hub
      - DECODO_USERNAME=${DECODO_USERNAME}
      - DECODO_PASSWORD=${DECODO_PASSWORD}
    ports:
      - "8888:8888"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.jupyter.rule=Host(`lab.${DOMAIN}`)
    #   - traefik.http.routers.jupyter.entrypoints=websecure
    #   - traefik.http.routers.jupyter.tls.certresolver=letsencrypt
    #   - traefik.http.routers.jupyter.middlewares=secured@file
    #   - traefik.http.services.jupyter.loadbalancer.server.port=8888

  # --- Contenedor de Chrome (Selenium + NoVNC) ---
  chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    restart: unless-stopped
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - VNC_NO_PASSWORD=1 # Authelia ya se encarga de la seguridad
    ports:
      - "7900:7900"
    # labels:
    #   - traefik.enable=true
    #   # Subdominio para ver el Bot
    #   - traefik.http.routers.bot.rule=Host(`bot.${DOMAIN}`)
    #   - traefik.http.routers.bot.entrypoints=websecure
    #   - traefik.http.routers.bot.tls.certresolver=letsencrypt
    #   - traefik.http.routers.bot.middlewares=secured@file
    #   # Puerto 7900 es para la interfaz web noVNC
    #   - traefik.http.services.bot.loadbalancer.server.port=7900

